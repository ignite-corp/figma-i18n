[build]
builder = "nixpacks"
buildCommand = "pnpm install --frozen-lockfile && pnpm --filter sync-server exec prisma generate && pnpm build:server"
watchPatterns = ["apps/sync-server/**", "packages/**", "tsconfig.base.json", "pnpm-lock.yaml", "railway.toml"]

[deploy]
startCommand = "pnpm --filter sync-server exec prisma db push --skip-generate && node apps/sync-server/dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
