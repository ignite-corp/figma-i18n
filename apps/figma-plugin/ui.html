<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        color: #333;
        background: #fff;
      }
      .container { padding: 12px; }
      .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
      .header h2 { font-size: 14px; font-weight: 600; }
      .btn { padding: 6px 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 11px; }
      .btn-primary { background: #18A0FB; color: #fff; }
      .btn-primary:hover { background: #0d8de5; }
      .btn-secondary { background: #f0f0f0; color: #333; }
      .btn-sm { padding: 4px 8px; font-size: 10px; }

      .filter-bar { display: flex; gap: 4px; margin-bottom: 12px; flex-wrap: wrap; }
      .filter-chip { padding: 4px 8px; border-radius: 12px; font-size: 10px; cursor: pointer; border: 1px solid #ddd; background: #fff; }
      .filter-chip.active { background: #18A0FB; color: #fff; border-color: #18A0FB; }

      .node-list { display: flex; flex-direction: column; gap: 8px; }
      .node-item { border: 1px solid #e5e5e5; border-radius: 8px; padding: 10px; }
      .node-item:hover { border-color: #18A0FB; }
      .node-text { font-size: 13px; font-weight: 500; margin-bottom: 4px; }
      .node-path { font-size: 10px; color: #999; margin-bottom: 6px; }
      .node-actions { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; }

      .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 9px; font-weight: 600; text-transform: uppercase; }
      .badge-matched { background: #e8f5e9; color: #2e7d32; }
      .badge-candidate { background: #fff3e0; color: #e65100; }
      .badge-new { background: #e3f2fd; color: #1565c0; }
      .badge-changed { background: #fce4ec; color: #c62828; }
      .badge-ignored { background: #f5f5f5; color: #999; }

      .candidate-list { margin-top: 6px; }
      .candidate-item { display: flex; justify-content: space-between; align-items: center; padding: 4px 8px; background: #fafafa; border-radius: 4px; margin-bottom: 2px; font-size: 11px; }
      .candidate-key { font-family: monospace; color: #666; }
      .candidate-score { font-size: 10px; color: #999; }

      .key-input { width: 100%; padding: 4px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; font-family: monospace; margin-top: 4px; }

      .summary { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
      .summary-item { font-size: 11px; }
      .summary-count { font-weight: 600; }

      .server-config { margin-bottom: 12px; }
      .server-config input { width: 100%; padding: 6px 8px; border: 1px solid #ddd; border-radius: 4px; font-size: 11px; }
      .server-config label { font-size: 10px; color: #666; display: block; margin-bottom: 2px; }

      .empty { text-align: center; padding: 32px; color: #999; }
      .loading { text-align: center; padding: 32px; color: #666; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <!-- SCRIPT -->
  </body>
</html>
